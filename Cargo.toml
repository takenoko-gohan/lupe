[package]
name = "lupe"
version = "0.1.1"
edition = "2021"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.0"
duckdb = { version = "1.10505.0", features = ["bundled"] }
hyper-util = "0.1.21"
prost = "0.14.4"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "signal", "process"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typed-builder = "0.23.2"

[target.'cfg(windows)'.dependencies]
async-stream = "0.3.6"
futures-core = "0.3.31"
windows = { version = "0.58.0", features = ["Win32"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
